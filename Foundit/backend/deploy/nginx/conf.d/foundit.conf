server {
  listen 80;
  server_name foundit.tw www.foundit.tw api.foundit.tw;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.foundit.tw;

  ssl_certificate /etc/letsencrypt/live/foundit.tw/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/foundit.tw/privkey.pem;

  return 301 https://foundit.tw$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name foundit.tw api.foundit.tw;

  ssl_certificate /etc/letsencrypt/live/foundit.tw/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/foundit.tw/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
