# Persistent beta environment; API port is published for the LAN tunnel host.
# The reverse proxy / named tunnel connects to this host on port 3000.
name: foundit-beta
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASS:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: foundit-api:beta
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SEED_SAMPLE_DATA: 'false'
      DB_HOST: postgres
      DB_PORT: '5432'
      PORT: '3000'
    ports: ['0.0.0.0:3000:3000']
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks: [data, edge]
volumes:
  postgres_data:
  uploads:
networks:
  data:
    internal: true
  edge:
