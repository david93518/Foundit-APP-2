# Persistent beta environment. Cloudflare Tunnel on this host connects to 127.0.0.1:3000.
# The API port is NOT published on the LAN by default: a direct LAN connection would skip
# Cloudflare and could forge CF-Connecting-IP. Set API_BIND_ADDR=0.0.0.0 only if the tunnel
# really runs on another machine (and then firewall port 3000 to that machine only).
name: foundit-beta
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      # 資料庫擁有者（超級使用者）只給 migration 用；API 用 DB_USER 的受限帳號，見 scripts/db-least-privilege.sql。
      POSTGRES_USER: ${DB_MIGRATION_USER:-${DB_USER:?}}
      POSTGRES_PASSWORD: ${DB_MIGRATION_PASS:-${DB_PASS:?}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: foundit-api:beta
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      SEED_SAMPLE_DATA: 'false'
      DB_HOST: postgres
      DB_PORT: '5432'
      PORT: '3000'
    ports: ['${API_BIND_ADDR:-127.0.0.1}:3000:3000']
    security_opt: ['no-new-privileges:true']
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks: [data, edge]
volumes:
  postgres_data:
  uploads:
networks:
  data:
    internal: true
  edge:
