name: foundit

services:
  cert-bootstrap:
    image: alpine:3.20
    restart: "no"
    volumes:
      - letsencrypt:/etc/letsencrypt
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        if [ -f /etc/letsencrypt/renewal/foundit.tw.conf ] || [ -f /etc/letsencrypt/live/foundit.tw/fullchain.pem ]; then
          exit 0
        fi
        apk add --no-cache openssl
        mkdir -p /etc/letsencrypt/live/foundit.tw
        openssl req -x509 -nodes -newkey rsa:2048 -days 2 \
          -keyout /etc/letsencrypt/live/foundit.tw/privkey.pem \
          -out /etc/letsencrypt/live/foundit.tw/fullchain.pem \
          -subj "/CN=foundit.tw"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASS:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - data

  api:
    image: ${API_IMAGE:?}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SEED_SAMPLE_DATA: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    networks:
      - edge
      - data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      cert-bootstrap:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./scripts/nginx-entrypoint.sh:/nginx-entrypoint.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    command: ["/bin/sh", "/nginx-entrypoint.sh"]
    networks:
      - edge

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    env_file: .env
    depends_on:
      - nginx
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c
    command:
      - |
        trap exit TERM
        sleep 120 &
        wait $$!
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook "touch /var/www/certbot/reload-nginx" || true
          sleep 12h &
          wait $$!
        done

volumes:
  postgres_data:
  redis_data:
  uploads:
  letsencrypt:
  certbot_www:

networks:
  edge:
  data:
    internal: true
